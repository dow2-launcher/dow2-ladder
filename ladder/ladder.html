<title>Elite Ladder — Dawn of War II</title>
<meta name="description" content="Рейтинг Elite по матчам автоматча Dawn of War II: Retribution: Glicko-2, 1v1 / 2v2 / 3v3, история матчей.">
<meta name="theme-color" content="#0a1112">
<!-- 17.11.2026 (SirItos, the preseason): one page in the launcher's look (1.6.20 "D look": the riveted frames and plates of the
     game's menus, teal glow on dark slate, Spectral headings, Roboto Condensed text; the art and the fonts are the launcher's own
     files, copied to /elite/ui and /elite/fonts). The Elite rating's table is the main view; the match history and the live queue
     are tabs; "How the rating works" under the table.
       /ladder/ , /ladder/table  - the table (?mode=2v2, ?lang=ru|en, #how = the rules open; the launcher links /ladder/table)
       /ladder/?view=history     - the match history (the old page's list; #history too)
       /ladder/?view=live        - who is searching, the matches being made, the open lobbies
       /ladder/player/<steam>    - a player's page (his modes, his matches with the change of the table's number)
     The old Relic-based season table (/ladder/api/board) was hidden on the old page already; it is not shown here. -->

<style>
@font-face { font-family: Cinzel; src: url(/elite/fonts/cinzel-700.ttf) format('truetype'); font-weight: 700; font-display: swap; }
@font-face { font-family: CinzelCyr; src: url(/elite/fonts/cormorantsc-cyr-700.ttf) format('truetype'); font-weight: 700; unicode-range: U+0400-045F, U+0490-0491, U+2116; font-display: swap; }
@font-face { font-family: Spectral; src: url(/elite/fonts/spectral-400.ttf) format('truetype'); font-weight: 400; font-display: swap; }
@font-face { font-family: Spectral; src: url(/elite/fonts/spectral-600.ttf) format('truetype'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'D Head'; src: url(/elite/fonts/spectral-600.ttf) format('truetype'); font-weight: 600 700; size-adjust: 93%; font-display: swap; }
@font-face { font-family: 'Roboto Condensed'; font-weight: 400 700; font-display: swap; size-adjust: 107%; src: url(/elite/fonts/roboto-condensed-cyrillic-ext.woff2) format('woff2'); unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F; }
@font-face { font-family: 'Roboto Condensed'; font-weight: 400 700; font-display: swap; size-adjust: 107%; src: url(/elite/fonts/roboto-condensed-cyrillic.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Roboto Condensed'; font-weight: 400 700; font-display: swap; size-adjust: 107%; src: url(/elite/fonts/roboto-condensed-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Roboto Condensed'; font-weight: 400 700; font-display: swap; size-adjust: 107%; src: url(/elite/fonts/roboto-condensed-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
:root {
  --art-bg: url(/elite/ui/bg.jpg); --art-frame: url(/elite/ui/frame-panel.jpg); --art-panel: url(/elite/ui/panel-fill.jpg);
  --art-plate: url(/elite/ui/plate.png); --art-plate-fill: url(/elite/ui/plate-fill.jpg); --art-plate-sq: url(/elite/ui/plate-sq.png);
  --art-card: url(/elite/ui/card-fill.jpg); --art-band: url(/elite/ui/band.png);
  --bg: #0a1112; --p: #0f1a1c; --p2: #152326; --ln: #1e5a52; --ln2: #2b8273; --tx: #e4f3ed; --sf: #bdd1cb; --mu: #86a19b; --dim: #6f8c86;
  --gd: #45e0c0; --gd2: #c8fff0; --el: #9fe3cf; --ok: #62e39a; --wa: #e8a14a; --bd: #ff8f7d; --sep: rgba(30, 90, 82, .55);
  --g1: #e9c46a; --g2: #c9d3d1; --g3: #c98a55;
  --fb: "Roboto Condensed", "Arial Narrow", Arial, sans-serif; --fh: "D Head", Spectral, Georgia, serif; --ft: Cinzel, CinzelCyr, serif;
  --veil: linear-gradient(rgba(5, 10, 11, .74), rgba(5, 10, 11, .74));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; color: var(--tx); font: 15px/1.45 var(--fb); -webkit-text-size-adjust: 100%;
  background: var(--veil), radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0, 0, 0, .7)), var(--art-bg) center / cover fixed, var(--bg); }
a { color: var(--gd); text-decoration: none; transition: color .15s, text-shadow .15s; }
a:hover, a:focus-visible { color: #c9f7ea; text-shadow: 0 0 6px rgba(69, 224, 192, .35); }
button, select, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 1px solid var(--gd); outline-offset: 2px; }

/* ---------- header: the game's logo arrangement, the tabs with a glow from below (the launcher's header) ---------- */
.hdr { display: flex; align-items: center; gap: 16px; min-height: 58px; padding: 0 20px; border-bottom: 2px solid var(--ln);
  background: linear-gradient(rgba(4, 9, 10, .9), rgba(4, 9, 10, .65)); box-shadow: 0 1px 0 #000, 0 0 14px rgba(69, 224, 192, .18); }
.brand { display: flex; align-items: center; flex: none; text-shadow: none; }
.brand:hover { text-shadow: none; }
.dd-logo { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 46px; margin-top: 5px; padding: 0 4px; }
.dd-ii { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 700 58px/.78 Cinzel, serif; letter-spacing: -6px; padding-right: 6px;
  background: linear-gradient(#ea5a47 0%, #c22d22 30%, #8e1610 66%, #560906 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: 1px rgba(38, 3, 2, .95); filter: drop-shadow(0 0 5px rgba(196, 40, 28, .45)) drop-shadow(0 1px 0 #000); pointer-events: none; }
.dd-w { position: relative; display: flex; align-items: center; gap: 6px; font: 700 18px/1 Cinzel, serif; letter-spacing: 1.6px; text-transform: uppercase; white-space: nowrap;
  background: linear-gradient(#fff 0%, #e3f1ed 38%, #98b1aa 54%, #eef8f5 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 1px 0 #000) drop-shadow(0 0 2px rgba(0, 0, 0, .95)); }
.dd-w em { font-style: normal; font-size: 10px; letter-spacing: 1px; vertical-align: 3px; margin: 0 1px; }
.dd-w::before, .dd-w::after { content: ""; width: 12px; height: 1px; background: linear-gradient(90deg, transparent, #cfdbd7); }
.dd-w::after { transform: scaleX(-1); }
.dd-sub { position: relative; margin-top: 5px; font: 700 10px/1 Cinzel, serif; letter-spacing: 4.6px; padding-left: 4.6px; text-transform: uppercase; color: #ddd5c4;
  text-shadow: 0 1px 1px #000, 0 0 2px #000; }
.tabs { display: flex; align-self: stretch; gap: 2px; }
.tab { display: flex; align-items: center; padding: 0 14px; font: 700 19px var(--fh); color: #8fb0a8; text-shadow: 0 1px 2px #000; white-space: nowrap; }
.tab:hover, .tab:focus-visible { color: #d6eee7; text-shadow: 0 1px 2px #000; }
.tab.on { color: #eafff8; background: linear-gradient(transparent 35%, rgba(69, 224, 192, .2)); text-shadow: 0 0 12px rgba(69, 224, 192, .8), 0 1px 2px #000; }
.hdr-r { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.hl { font: 600 14px var(--fb); white-space: nowrap; }
.lang { display: inline-flex; border: 1px solid #2b6f64; background: #061011; }
.lang button { border: 0; background: none; padding: 4px 9px; font: 600 12.5px var(--fb); color: var(--mu); cursor: pointer; }
.lang button.on { color: #eafff8; background: #0f3d36; box-shadow: inset 0 0 6px rgba(69, 224, 192, .35); }

/* ---------- buttons: the game's plate for the main one, a metal frame for the ordinary (the launcher's .btn / .btn.gold) ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 13px; border: 2px solid transparent; border-radius: 0;
  background: linear-gradient(#1b2c2e, #0c1516) padding-box, linear-gradient(#5f7c78, #24393a 45%, #121c1d) border-box;
  box-shadow: 0 0 0 1px #000, inset 0 1px 0 rgba(255, 255, 255, .07), inset 0 0 0 1px rgba(69, 224, 192, .12);
  font: 700 15px/1 var(--fh); color: #dcefe9; text-shadow: 0 1px 2px #000; white-space: nowrap; cursor: pointer; transition: box-shadow .12s, color .12s, filter .12s; }
.btn:hover, .btn:focus-visible { color: #fff; text-shadow: 0 1px 2px #000;
  box-shadow: 0 0 0 1px #000, inset 0 0 0 1px rgba(69, 224, 192, .75), inset 0 0 10px rgba(69, 224, 192, .22), 0 0 7px rgba(69, 224, 192, .28); }
.btn.gold, .seg button.on { border: 6px solid transparent; border-image: var(--art-plate) 14 / 6px; background: var(--art-plate-fill) center / 100% 100% padding-box;
  color: #fff; text-shadow: 0 1px 2px #000, 0 0 8px rgba(0, 0, 0, .6); box-shadow: none; filter: brightness(1.1) drop-shadow(0 0 3px rgba(69, 224, 192, .3)); }
.btn.gold:hover, .btn.gold:focus-visible { box-shadow: none; filter: brightness(1.22) drop-shadow(0 0 6px rgba(69, 224, 192, .5)); }
.btn.small { height: 28px; padding: 0 10px; font-size: 14px; }
.seg { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.seg button { height: 34px; padding: 0 16px; border: 2px solid transparent; border-radius: 0; cursor: pointer;
  background: linear-gradient(#1b2c2e, #0c1516) padding-box, linear-gradient(#5f7c78, #24393a 45%, #121c1d) border-box;
  box-shadow: 0 0 0 1px #000, inset 0 1px 0 rgba(255, 255, 255, .07), inset 0 0 0 1px rgba(69, 224, 192, .12);
  font: 700 16px/1 var(--fh); color: #9fbab3; text-shadow: 0 1px 2px #000; transition: box-shadow .12s, color .12s, filter .12s; }
.seg button:hover:not(.on) { color: #fff; box-shadow: 0 0 0 1px #000, inset 0 0 0 1px rgba(69, 224, 192, .75), inset 0 0 10px rgba(69, 224, 192, .22), 0 0 7px rgba(69, 224, 192, .28); }
.seg button.on { padding: 0 12px; filter: brightness(1.18) drop-shadow(0 0 6px rgba(69, 224, 192, .5)); cursor: default; }
.seg.small button { height: 28px; padding: 0 10px; font-size: 14px; }
.seg.small button.on { padding: 0 6px; }

/* ---------- panels: the riveted frame of "Looking for Ideal Match", its grimy teal inside ---------- */
.wrap { max-width: 1040px; margin: 0 auto; padding: 18px 16px 40px; }
.panel { border: 10px solid transparent; border-image: var(--art-frame) 34 / 10px; background: var(--veil), var(--art-panel) center / cover padding-box;
  padding: 8px 14px 14px; margin-bottom: 16px; min-width: 0; }
.ph { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 2px 0 10px; margin-bottom: 10px;
  background: var(--art-band) center bottom / auto 12px repeat-x; }
.h { margin: 0; font: 700 23px/1.2 var(--fh); color: #d8f6ea; text-shadow: 0 2px 2px #000; }
.h2 { margin: 0; font: 700 19px/1.2 var(--fh); color: #d8f6ea; text-shadow: 0 2px 2px #000; }
.sp { flex: 1; }
.tag { display: inline-block; padding: 2px 8px; font: 700 11px/1.3 var(--fb); letter-spacing: .1em; text-transform: uppercase; border: 1px solid; white-space: nowrap; }
.tag.pre { color: var(--wa); border-color: rgba(232, 161, 74, .55); background: rgba(58, 36, 12, .55); box-shadow: 0 0 8px rgba(232, 161, 74, .18); }
.tag.m { color: var(--sf); border-color: var(--ln2); background: rgba(16, 48, 43, .6); }
.muted { color: var(--mu); }
.empty { padding: 26px 12px; text-align: center; color: var(--mu); }

/* ---------- the table: rows as the launcher's cards; the top three in the game's plate with their medal's glow ---------- */
.tb { --cols: 56px minmax(0, 1fr) 150px 84px 120px; }
.tr { display: grid; grid-template-columns: var(--cols); align-items: center; min-height: 46px; }
.tr > * { padding: 0 10px; text-align: right; white-space: nowrap; font-variant-numeric: lining-nums tabular-nums; }
.tr > .l { text-align: left; }
.th { min-height: 26px; font: 700 11.5px var(--fb); letter-spacing: .09em; text-transform: uppercase; color: var(--mu); padding: 0 1px; }
.th > * { cursor: default; }
.tr.p { margin-top: 4px; border: 1px solid rgba(43, 130, 115, .38); background: linear-gradient(rgba(5, 10, 11, .62), rgba(5, 10, 11, .62)), var(--art-card) center / cover;
  color: inherit; text-shadow: none; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 1px 2px rgba(0, 0, 0, .5); transition: box-shadow .12s, background-color .12s; }
.tr.p:hover, .tr.p:focus-visible { color: inherit; text-shadow: none; outline: none;
  box-shadow: inset 0 0 0 1px rgba(69, 224, 192, .75), inset 0 0 14px rgba(69, 224, 192, .2), 0 0 8px rgba(69, 224, 192, .3); }
.tr.p.top { border: 6px solid transparent; border-image: var(--art-plate-sq) 14 / 6px; min-height: 56px; margin: 6px -5px 0;
  background: linear-gradient(rgba(5, 10, 11, .45), rgba(5, 10, 11, .45)), var(--art-card) center / cover padding-box; }
.tr.p.top1 { filter: drop-shadow(0 0 6px rgba(233, 196, 106, .35)); }
.tr.p.top:hover { filter: brightness(1.15) drop-shadow(0 0 7px rgba(69, 224, 192, .5)); box-shadow: none; }
.rk { font: 700 18px var(--fh); color: var(--mu); }
.top1 .rk { color: var(--g1); text-shadow: 0 0 10px rgba(233, 196, 106, .55); font-size: 22px; }
.top2 .rk { color: var(--g2); text-shadow: 0 0 8px rgba(201, 211, 209, .35); font-size: 20px; }
.top3 .rk { color: var(--g3); text-shadow: 0 0 8px rgba(201, 138, 85, .35); font-size: 20px; }
.nm { display: flex; align-items: center; gap: 7px; min-width: 0; font: 600 16px var(--fh); color: #eafff8; }
.nm span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.top .nm { font-size: 17.5px; }
.rv { font: 700 19px var(--fh); color: var(--el); text-shadow: 0 0 10px rgba(69, 224, 192, .35); }
.top .rv { font-size: 21px; color: #dffff6; text-shadow: 0 0 12px rgba(69, 224, 192, .6); }
.wl { color: var(--sf); } .wl .w { color: var(--ok); } .wl .lo { color: var(--bd); } .wl .lv { color: var(--wa); }
.hr { color: var(--sf); }
.cal { display: inline-flex; align-items: center; gap: 7px; justify-content: flex-end; font: 600 14px var(--fb); color: var(--sf); font-variant-numeric: tabular-nums; }
.calh { display: flex; align-items: center; gap: 10px; margin: 16px 0 2px; font: 700 12px var(--fb); letter-spacing: .12em; text-transform: uppercase; color: var(--mu); }
.calh::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--ln2), transparent); }
.tr.cr .nm { color: var(--sf); font-weight: 400; }
.tnote { margin: 12px 2px 0; font-size: 13px; color: var(--mu); }

/* ---------- the rules: an accordion in the same frame ---------- */
details.panel { padding-top: 4px; scroll-margin-top: 10px; }
summary { display: flex; align-items: center; gap: 12px; padding: 8px 2px; cursor: pointer; list-style: none; font: 700 20px var(--fh); color: #d8f6ea; text-shadow: 0 2px 2px #000; }
summary::-webkit-details-marker { display: none; }
summary::before { content: ""; flex: none; width: 9px; height: 9px; border: solid var(--gd); border-width: 0 2px 2px 0; transform: rotate(-45deg); transition: transform .15s;
  filter: drop-shadow(0 0 3px rgba(69, 224, 192, .6)); }
details[open] summary::before { transform: rotate(45deg); }
details[open] summary { background: var(--art-band) center bottom / auto 12px repeat-x; padding-bottom: 16px; margin-bottom: 4px; }
summary:hover { color: #fff; text-shadow: 0 0 10px rgba(69, 224, 192, .55), 0 2px 2px #000; }
.how { padding: 0 6px 4px; color: var(--sf); font-size: 15px; line-height: 1.55; }
.how h3 { margin: 16px 0 6px; font: 700 17px var(--fh); color: var(--gd2); }
.how h3:first-child { margin-top: 6px; }
.how p { margin: 0 0 8px; }
.how ul { margin: 0 0 8px; padding-left: 20px; }
.how li { margin: 0 0 4px; }
.how li::marker { color: var(--gd); }
.how b { color: var(--tx); }

/* ---------- fields (the launcher's) ---------- */
select, input[type=search] { height: 32px; border: 1px solid #2b6f64; border-radius: 0; background: #061011; color: #e8fff6; font: 500 14px var(--fb); }
input[type=search] { padding: 0 10px; }
input:focus, select:focus { outline: none; border-color: var(--gd); box-shadow: 0 0 5px rgba(69, 224, 192, .25); }
select { appearance: none; -webkit-appearance: none; padding: 0 30px 0 10px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--gd) 50%), linear-gradient(135deg, var(--gd) 50%, transparent 50%), linear-gradient(#112324, #081314);
  background-position: calc(100% - 15px) 14px, calc(100% - 10px) 14px, 0 0; background-size: 5px 5px, 5px 5px, 100% 100%; background-repeat: no-repeat; }
select:hover { border-color: var(--gd); }
select option { background: #0b1718; }
input::placeholder { color: var(--dim); }
input[type=checkbox] { accent-color: var(--gd); }

/* ---------- the match history ---------- */
.hfil { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
.hfil input { flex: 1 1 220px; min-width: 0; }
.hfil select { flex: 0 1 auto; max-width: 100%; }
.card { border: 6px solid transparent; border-image: var(--art-plate-sq) 14 / 6px; background: linear-gradient(rgba(5, 10, 11, .62), rgba(5, 10, 11, .62)), var(--art-card) center / cover padding-box; }
.hm { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 6px 8px; margin-bottom: 6px; transition: filter .12s; }
.hm:hover { filter: brightness(1.1) drop-shadow(0 0 5px rgba(69, 224, 192, .35)); }
.mini { width: 84px; height: 84px; background: #061011 center / cover no-repeat; border: 1px solid #2b6f64; box-shadow: 0 0 0 1px #000; }
.hd { color: var(--mu); font-size: 13px; margin-bottom: 4px; }
.hd b { color: var(--tx); font-weight: 600; }
.hteams { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; }
.vsx { font: 700 13px var(--fh); color: var(--dim); }
.side { min-width: 0; padding: 3px 6px; }
.side.win { background: linear-gradient(90deg, rgba(69, 224, 192, .16), transparent); box-shadow: inset 2px 0 0 var(--gd); }
.side.lose { opacity: .8; }
.pl { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 15px; line-height: 1.25; padding: 2px 0; }
.pl img { width: 26px; height: 26px; flex: none; background: #061011; border: 1px solid rgba(43, 130, 115, .5); }
.pl img.rc { width: 20px; height: 20px; border: 0; background: none; }
.pl .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.pl .r { color: var(--mu); font-size: 13px; font-variant-numeric: tabular-nums; flex: none; }
.pl .d { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; flex: none; margin-left: 2px; }
.pl .d.up { color: var(--ok); } .pl .d.dn { color: var(--bd); }
.rnd { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; flex: none; border: 1px solid var(--ln2); color: var(--gd); font: 700 13px/1 var(--fh); background: #061011; }
.act { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.res { font: 600 12.5px var(--fb); color: var(--mu); white-space: nowrap; }
.res.est { color: var(--wa); font-style: italic; }
.more { display: flex; margin: 10px auto 0; }

/* ---------- live: the counters, who is searching, the matches, the open lobbies ---------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { padding: 8px 6px 6px; text-align: center; }
.stat b { display: block; font: 700 28px/1.1 var(--fh); color: var(--el); text-shadow: 0 0 10px rgba(69, 224, 192, .45); font-variant-numeric: lining-nums tabular-nums; }
.stat.q b { color: var(--wa); text-shadow: 0 0 10px rgba(232, 161, 74, .4); } .stat.play b { color: var(--ok); text-shadow: 0 0 10px rgba(98, 227, 154, .4); }
.stat span { font: 600 11.5px var(--fb); letter-spacing: .1em; text-transform: uppercase; color: var(--mu); }
.live2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.cnt { font: 700 16px var(--fh); color: var(--gd); }
.li { padding: 8px 2px; border-bottom: 1px solid var(--sep); font-size: 14.5px; }
.li:last-child { border-bottom: 0; }
.li .top { display: flex; justify-content: space-between; gap: 8px; }
.li .rt { color: var(--el); font-variant-numeric: tabular-nums; }
.li .meta, .meta { color: var(--mu); font-size: 13px; }

.st.creating { color: var(--wa); border-color: rgba(232, 161, 74, .5); } .st.lobby { color: #8fc0e6; border-color: #2e4a5f; } .st.playing { color: var(--ok); border-color: rgba(98, 227, 154, .45); }

<script>
'use strict';
// ---------- texts: the rating (the table, the player page, the rules) ----------
const I18N = {
  ru: { title: 'Рейтинг Elite', home: 'На главную', pre: 'Предсезон', test: 'Тест', player: 'Игрок', rating: 'Рейтинг', games: 'Игр', wl: 'П – П – У',
    ratingHint: 'Осторожный рейтинг: Glicko-2 минус две неопределённости (RD)', wlHint: 'Победы – поражения – поражения за уход',
    cal: (k, n) => `калибровка ${k}/${n}`, loading: 'Загрузка…', empty: 'В этом режиме пока никто не играл.', err: 'Не удалось загрузить.',
    stats: 'Страница игрока', back: '← К таблице', steam: 'Профиль Steam', recent: 'Последние матчи', all: 'Все', noGames: 'нет игр',
    noMatches: 'Матчей пока нет.', place: n => `#${n}`, gamesN: n => `${n} ${plural(n, 'игра', 'игры', 'игр')}`,
    tableNum: c => `Число таблицы после матча: ${c}`, calDone: 'калибровка пройдена', unrated: 'без рейтинга', vs: 'vs', min: 'мин',
    fin: { win: 'Победа', loss: 'Поражение', loss_leave: 'Уход', none: 'Без итога' },
    why: { room: 'комната лаунчера, не автоматч', early_leave: 'выход в первые 3 минуты', no_winner: 'итог не определён', no_data: 'нет данных о выходе игроков',
      no_history: 'нет записи автоматча', all_gone: 'все вышли разом (сбой сети или сервера)', reports_disagree: 'отчёты игр расходятся, на проверке',
      winners_left: 'победители вышли до конца, на проверке', not_full_teams: 'неполные команды', no_steam: 'нет Steam ID',
      short_match: 'матч короче 3 минут (сдача или выход)', void: 'аннулирован вручную', not_elite: 'не Elite (ваниль)' },
    note: { early_forgiven: 'первый ранний выход за сутки — прощён', left_first: 'вышел до конца матча', short_handed: 'играли в меньшинстве — половина потери',
      repeat_pair: 'тот же соперник 4-й раз за сутки — четверть изменения', manual_winner: 'итог исправлен вручную' },
    howTitle: 'Как работает рейтинг',
    how: pre => `
<h3>Рейтинг и неопределённость</h3>
<p>Рейтинг считается по системе <b>Glicko-2</b>. У каждого игрока в каждом режиме два числа: <b>рейтинг</b> — оценка силы, и <b>неопределённость</b> — насколько система в этой оценке уверена. Новичок начинает с 1500 и большой неопределённостью: система о нём ещё ничего не знает.</p>
<p>В таблице показано <b>осторожное число</b>: рейтинг минус две неопределённости. Это уровень, ниже которого вы почти наверняка не играете. Пока игр мало, неопределённость велика и число в таблице ниже рейтинга; с каждой игрой она уменьшается, и число подтягивается к рейтингу. Поэтому серия из нескольких удачных побед не выводит новичка сразу на первое место. Точный рейтинг и неопределённость видны в подсказке у числа.</p>
<h3>Что даёт победа, поражение и уход</h3>
<ul>
<li><b>Победа</b> поднимает рейтинг, <b>поражение</b> опускает.</li>
<li>Насколько — зависит от соперника: победа над более сильным даёт больше, над слабым — меньше; поражение от слабого стоит дороже, чем от сильного.</li>
<li>И от неопределённости: у новичка рейтинг движется быстро, у опытного игрока — спокойнее. Соперник, о котором система мало знает, влияет на ваш рейтинг слабее.</li>
<li>В 2v2 и 3v3 каждый сравнивается со средним рейтингом команды соперника, а изменение у каждого своё — по его рейтингу и неопределённости.</li>
<li>Поэтому изменение за матч у всех разное. На странице игрока у каждого матча показано, как изменилось число в таблице. Пока неопределённость большая, она заметно уменьшается с каждой игрой, и число в таблице может немного вырасти даже после поражения.</li>
<li><b>Уход = поражение.</b> Вышел, вылетел или потерял связь до конца матча — это поражение, даже если команда потом победила (колонка «У» в таблице). Тиммейтам ушедшего, если команда проиграла в меньшинстве, — только половина потери.</li>
</ul>
<h3>Калибровка</h3>
<p>Первые <b>5 игр</b> в режиме рейтинг считается, но не показывается: в таблице написано «калибровка 2/5», такие игроки стоят под рейтинговыми, по алфавиту. После пятой игры рейтинг появляется в таблице.</p>
<h3>Какие матчи не идут в рейтинг</h3>
<ul>
<li>Считаются только матчи <b>нашего автоматча</b> (Find a Game) в <b>Elite</b>. Комнаты лаунчера, кастомки, игры с компьютером и ваниль в рейтинг не идут.</li>
<li><b>Первые 3 минуты.</b> Если кто-то вышел в первые 3 минуты, матч не идёт в рейтинг ни для кого. Первый такой выход за сутки прощается; второй и следующие — поражение тому, кто вышел.</li>
<li>Матч, закончившийся быстрее 3 минут (сдача или выход), тоже не в рейтинге.</li>
<li>Если все отвалились разом (сбой сервера или сети), матч не считается.</li>
<li><b>Одни и те же соперники.</b> Если в 1v1 одна и та же пара играет больше трёх раз за сутки, с 4-го матча рейтинг меняется только на четверть.</li>
<li>Спорные матчи (отчёты игр расходятся, победители вышли до конца) проверяем вручную.</li>
</ul>
<h3>Как подбираются соперники</h3>
<ul>
<li>Автоматч подбирает по этому же рейтингу (по самому рейтингу, не по осторожному числу) — каждому режиму свой.</li>
<li>Сначала ищет соперника с разницей до <b>150</b> очков. С каждой минутой ожидания окно шире на <b>50</b>, а после <b>6 минут</b> подойдёт любой — чтобы никто не ждал бесконечно.</li>
<li>Игроки на калибровке ищутся как 1500, и окно для них шире: система ещё не знает их уровень.</li>
<li>В 2v2 и 3v3 команды делятся так, чтобы их суммарные рейтинги были как можно ближе.</li>
</ul>
<h3>${pre ? 'Предсезон' : 'Сейчас — тест'}</h3>
<p>${pre ? 'Сейчас идёт предсезон: мы проверяем правила в боевых условиях. К старту сезона рейтинги всех игроков обнулятся. Предложения и возражения пишите в Discord или в чат лаунчера.'
          : 'Таблица пока тестовая: мы проверяем правила. Перед стартом рейтинги всех игроков обнулятся.'}</p>` },
  en: { title: 'Elite Rating', home: 'Home', pre: 'Preseason', test: 'Test', player: 'Player', rating: 'Rating', games: 'Games', wl: 'W – L – Lv',

<h3>Rating and uncertainty</h3>
<p>The rating is <b>Glicko-2</b>. Every player has two numbers in every mode: the <b>rating</b>, an estimate of how strong you are, and the <b>uncertainty</b>, how sure the system is about it. A newcomer starts at 1500 with a large uncertainty: the system knows nothing about him yet.</p>
<p>The table shows a <b>conservative number</b>: the rating minus two uncertainties, a level you almost certainly play at or above. With few games the uncertainty is large and the number is well below the rating; every game makes it smaller and the number closes in on the rating. So a lucky streak of a few wins does not put a newcomer straight on top. The exact rating and uncertainty are in the number's tooltip.</p>
<h3>What a win, a loss and a leave give</h3>

$('#lang').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; LANG = b.dataset.l;
  if (QS.get('lang')) { QS.set('lang', LANG); history.replaceState(null, '', location.pathname + '?' + QS + location.hash); }
  try { localStorage.setItem('ladderLang', LANG); } catch (er) {} applyLang(); });
showView(VIEW); applyLang();
if (PSTEAM) loadPlayer();
openHow();
/* Inbox: only for the admins of the feedback chat (their Steam sign-in on this site); nobody else sees the link */
fetch('/ladder/api/inbox/me', { credentials: 'same-origin' }).then(r => r.json()).then(m => { if (m && m.admin) $('#inboxLink').hidden = false; }).catch(() => {});
</script>
</body>
</html>
