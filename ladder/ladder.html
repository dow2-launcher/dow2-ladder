<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Elite Ladder — Dawn of War II</title>
<meta name="description" content="Рейтинг Elite по матчам автоматча Dawn of War II: Retribution: Glicko-2, 1v1 / 2v2 / 3v3, история матчей.">
<meta name="theme-color" content="#0a1112">
<!-- 17.11.2026 (SirItos, the preseason): one page in the launcher's look (1.6.20 "D look": the riveted frames and plates of the
     game's menus, teal glow on dark slate, Spectral headings, Roboto Condensed text; the art and the fonts are the launcher's own
     files, copied to /elite/ui and /elite/fonts). The Elite rating's table is the main view; the match history and the live queue
     are tabs; "How the rating works" under the table.
       /ladder/ , /ladder/table  - the table (?mode=2v2, ?lang=ru|en, #how = the rules open; the launcher links /ladder/table)
       /ladder/?view=history     - the match history (the old page's list; #history too)
       /ladder/?view=live        - who is searching, the matches being made, the open lobbies
       /ladder/player/<steam>    - a player's page (his modes, his matches with the change of the table's number)
     The old Relic-based season table (/ladder/api/board) was hidden on the old page already; it is not shown here.
     17.11.2026 (SirItos: "with a bad connection our frame pictures do not load"): some Russian ISPs' DPI freezes any single answer
     from Germany bigger than ~30 KB. So every file of this page stays under 30 KB uncompressed (test_ladder_page.py checks it): this
     HTML, its style (/elite/ui/ladder.css + ladder-x.css), its script (/elite/ui/ladder-t.js texts, ladder.js table + player,
     ladder-x.js history + live + the start; deferred, in this order, one global scope), four woff2 font subsets (< 20 KB each).
     The frames, plates, bands and rivets are pure CSS - the page looks right with no picture loaded; three small textures (< 12 KB)
     are only an extra. The minimaps are 168 px webp thumbs (/elite/assets/maps_s/). After changing a file bump ?v= below. -->
<link rel="stylesheet" href="/elite/ui/badges.css">
<link rel="stylesheet" href="/elite/ui/ladder.css?v=20261117b">
<link rel="stylesheet" href="/elite/ui/ladder-x.css?v=20261117b">
<script defer src="/elite/ui/ladder-t.js?v=20261117b"></script>
<script defer src="/elite/ui/ladder.js?v=20261117b"></script>
<script defer src="/elite/ui/ladder-x.js?v=20261117b"></script>
<script defer src="/elite/ui/mirrors.js"></script>
</head>
<body>
<header class="hdr">
  <a class="brand" href="/ladder/" aria-label="Elite Ladder — Dawn of War II"><span class="dd-logo" aria-hidden="true"><b class="dd-ii">II</b><span class="dd-w">Dawn <em>of</em> War</span><span class="dd-sub">Elite Ladder</span></span></a>
  <nav class="tabs" id="tabs"><a class="tab" data-v="table" href="/ladder/" data-t="tabTable"></a><a class="tab" data-v="history" href="/ladder/?view=history" data-t="tabHistory"></a><a class="tab" data-v="live" href="/ladder/?view=live" data-t="tabLive"></a></nav>
  <div class="hdr-r">
    <a class="hl" href="/ladder/chat" data-t="chatLink"></a>
    <a class="hl" href="/ladder/inbox" id="inboxLink" hidden>Inbox</a>
    <a class="btn gold small" href="/elite/" data-t="dlLauncher"></a>
    <span data-mirrors></span>
    <div class="lang" id="lang"><button data-l="ru">RU</button><button data-l="en">EN</button></div>
  </div>
</header>

<div class="wrap">
  <main id="vTable" hidden>
    <section class="panel">
      <div class="ph"><h1 class="h" data-t="title"></h1><span class="tag pre" id="tag" hidden></span><span class="muted" id="seasonL"></span><span class="sp"></span>
        <div class="seg" id="modes"><button data-m="1v1" class="on">1 vs 1</button><button data-m="2v2">2 vs 2</button><button data-m="3v3">3 vs 3</button></div></div>
      <div class="tb" id="tb">
        <div class="tr th"><span class="l">#</span><span class="l" data-t="player"></span><span data-t="rating" data-h="ratingHint"></span><span data-t="gamesCol"></span><span data-t="wlCol" data-h="wlHint2"></span></div>
        <div id="rows"><div class="empty" data-t="loading"></div></div>
      </div>
      <p class="tnote" data-t="tableNote"></p>
    </section>
  </main>

  <main id="vPlayer" hidden>
    <section class="panel">
      <a class="back" id="back" href="/ladder/" data-t="back"></a>
      <div id="pv"><div class="empty" data-t="loading"></div></div>
    </section>
  </main>

  <details class="panel" id="how" hidden><summary data-t="howTitle"></summary><div class="how" id="howText"></div></details>

  <main id="vHistory" hidden>
    <section class="panel">
      <div class="ph"><h1 class="h" data-t="hist"></h1></div>
      <div class="hfil">
        <input id="h-q" type="search" data-tp="hq" aria-label="search">
        <select id="h-mode" aria-label="mode"><option value="" data-t="allModes"></option><option>1v1</option><option>2v2</option><option>3v3</option></select>
        <select id="h-race" aria-label="race"></select>
        <select id="h-map" aria-label="map"></select>
      </div>
      <div id="h-list"><div class="empty" data-t="loading"></div></div>
      <button class="btn more" id="h-more" hidden data-t="more"></button>
    </section>
  </main>

  <main id="vLive" hidden>
    <div class="stats">
      <div class="stat card"><b id="s-ingame">—</b><span data-t="ingame"></span></div>
      <div class="stat card"><b id="s-online">—</b><span data-t="online"></span></div>
      <div class="stat card q"><b id="s-queue">—</b><span data-t="queue"></span></div>
      <div class="stat card play"><b id="s-playing">—</b><span data-t="playing"></span></div>
    </div>
    <div class="live2">
      <section class="panel"><div class="ph"><h2 class="h2" data-t="searching"></h2><span class="cnt" id="l-n">0</span><span class="sp"></span>
        <label class="dbg-tgl"><input type="checkbox" id="dbg"> <span data-t="dbgLabel"></span></label></div>
        <div id="l-search"><div class="empty" data-t="loading"></div></div></section>
      <section class="panel"><div class="ph"><h2 class="h2" data-t="matches"></h2><span class="cnt" id="l-m">0</span></div><div id="l-matches"><div class="empty" data-t="loading"></div></div></section>
    </div>
    <section class="panel"><div class="ph"><h2 class="h2" data-t="rooms"></h2><span class="cnt" id="l-r">0</span></div>
      <div class="rsub" data-t="roomsSub"></div><div id="l-rooms"><div class="empty" data-t="loading"></div></div></section>
  </main>
</div>
<div class="foot"><span data-t="foot"></span> · <a href="/elite/">Elite Launcher</a></div>

</body>
</html>
