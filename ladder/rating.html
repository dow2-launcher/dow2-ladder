<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico" sizes="any">
<title>Elite Rating — Dawn of War II</title>
<meta name="description" content="Рейтинг Elite по матчам автоматча: Glicko-2, 1v1 / 2v2 / 3v3.">
<meta name="robots" content="noindex">
<!-- 17.11.2026: the own rating's table alone (SirItos: only the table, the mode switch, a player -> his stats, Home, and how the
     rating works under an accordion). Data: /ladder/api/own (rows: the rated by the shown rating, then calibration by name).
     The look of the launcher (1.5 "D look": teal on dark slate, Spectral headings, Roboto Condensed text).
     17.11.2026 (SirItos): served at /ladder/table (?mode=2v2, #how = the rules open) and, for a player, at /ladder/player/<steam>
     (/ladder/api/own/player: his modes, his recent matches with the change of the table's number); /ladder/rating/ redirects here.
     "Preseason" only when the server has own_season.json (the API's preseason flag), else "Test". -->
<style>
@font-face { font-family: Spectral; src: url(/elite/fonts/spectral-400.ttf); font-weight: 400; font-display: swap; }
@font-face { font-family: Spectral; src: url(/elite/fonts/spectral-600.ttf); font-weight: 600; font-display: swap; }
@font-face { font-family: Cinzel; src: url(/elite/fonts/cinzel-700.ttf); font-weight: 700; font-display: swap; }
@font-face { font-family: CinzelCyr; src: url(/elite/fonts/cormorantsc-cyr-700.ttf); font-weight: 700; unicode-range: U+0400-045F, U+0490-0491, U+2116; font-display: swap; }
:root {
  --bg: #0a1112; --p: #0f1a1c; --p2: #152326; --ln: #1e5a52; --ln2: #2b8273; --tx: #e4f3ed; --sf: #bdd1cb; --mu: #86a19b; --dim: #6f8c86;
  --gd: #45e0c0; --gd2: #c8fff0; --gdbg: #10302b; --ok: #62e39a; --wa: #e8a14a; --bd: #ff8f7d;
  --fb: "Roboto Condensed", "Arial Narrow", Arial, sans-serif; --fh: Spectral, Georgia, serif; --ft: Cinzel, CinzelCyr, Spectral, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--tx); font: 15px/1.45 var(--fb); min-height: 100vh;
  background-image: radial-gradient(ellipse at 50% -20%, rgba(69, 224, 192, .10), transparent 60%); }
a { color: var(--gd2); text-decoration: none; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 48px; }
.top { display: flex; align-items: center; gap: 12px; padding: 22px 0 14px; border-bottom: 2px solid var(--ln); box-shadow: 0 1px 0 #000; }
.top h1 { margin: 0; font: 700 26px var(--ft); letter-spacing: 3px; color: #e8fff8; text-shadow: 0 0 14px rgba(69, 224, 192, .35); white-space: nowrap; }
.top h1 a { color: inherit; }
.tag { font: 600 12px var(--fb); letter-spacing: .08em; text-transform: uppercase; color: var(--wa); border: 1px solid rgba(232, 161, 74, .5); padding: 2px 8px; }
.sp { flex: 1; }
.btn { font: 600 15px var(--fh); color: var(--tx); background: var(--p2); border: 1px solid var(--ln2); padding: 6px 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { color: var(--gd2); border-color: var(--gd); }
.lang { display: inline-flex; border: 1px solid var(--ln); }
.lang button { font: 600 13px var(--fb); color: var(--mu); background: none; border: 0; padding: 6px 10px; cursor: pointer; }
.lang button.on { color: var(--gd2); background: var(--gdbg); }
.modes { display: inline-flex; margin: 18px 0 12px; border: 1px solid var(--ln2); }
.modes button { font: 600 17px var(--fh); color: #8fb0a8; background: none; border: 0; padding: 7px 20px; cursor: pointer; }
.modes button + button { border-left: 1px solid var(--ln); }
.modes button.on { color: #eafff8; background: linear-gradient(transparent 30%, rgba(69, 224, 192, .22)); text-shadow: 0 0 10px rgba(69, 224, 192, .7); }
table { width: 100%; border-collapse: collapse; table-layout: fixed; background: var(--p); border: 1px solid var(--ln); }
th { font: 600 12px var(--fb); letter-spacing: .08em; text-transform: uppercase; color: var(--mu); text-align: right; padding: 10px 12px;
  border-bottom: 1px solid var(--ln); background: var(--p2); }
td { padding: 9px 12px; border-bottom: 1px solid rgba(30, 90, 82, .45); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
th.l, td.l { text-align: left; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: rgba(69, 224, 192, .05); }
.c-n { width: 48px; } .c-r { width: 150px; } .c-g { width: 64px; } .c-wl { width: 120px; }
td.n { color: var(--mu); }
td.n.t1, .rk.t1 { color: #f0d48f; } td.n.t2, .rk.t2 { color: #cfd2d6; } td.n.t3, .rk.t3 { color: #cd8f52; }
td.pl { overflow: hidden; text-overflow: ellipsis; font-size: 16px; }
td.pl a:hover, .pa:hover { text-decoration: underline; }
td.r { font: 600 17px var(--fh); color: var(--gd2); }
td.cal { color: var(--mu); font: 400 14px var(--fb); }
tr.calrow td.pl a { color: var(--sf); }
tr.firstcal td { border-top: 1px solid var(--ln2); }
.wl .lv { color: var(--wa); }
.empty { text-align: center; color: var(--mu); padding: 28px 12px; white-space: normal; }
details { margin-top: 18px; background: var(--p); border: 1px solid var(--ln); scroll-margin-top: 12px; }
summary { cursor: pointer; padding: 11px 14px; font: 600 17px var(--fh); color: var(--sf); list-style: none; display: flex; align-items: center; gap: 10px; }
summary::-webkit-details-marker { display: none; }
summary::before { content: ""; width: 7px; height: 7px; border: solid var(--gd); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); transition: transform .15s; flex: none; }
details[open] summary::before { transform: rotate(45deg); }
summary:hover { color: var(--gd2); }
.how { padding: 0 18px 14px 18px; color: var(--sf); font-size: 15px; line-height: 1.55; }
.how h3 { margin: 16px 0 6px; font: 600 16px var(--fh); color: var(--gd2); }
.how h3:first-child { margin-top: 4px; }
.how p { margin: 0 0 8px; }
.how ul { margin: 0 0 8px; padding-left: 20px; }
.how li { margin: 0 0 4px; }
.how b { color: var(--tx); font-weight: 700; }
/* the player page */
.back { display: inline-block; margin: 18px 0 4px; font: 600 15px var(--fh); color: var(--sf); }
.back:hover { color: var(--gd2); }
.ph { display: flex; align-items: center; gap: 14px; margin: 12px 0 16px; min-width: 0; }
.av { width: 64px; height: 64px; flex: none; border: 1px solid var(--ln2); background: var(--p2); object-fit: cover;
  display: flex; align-items: center; justify-content: center; font: 600 28px var(--fh); color: var(--gd2); }
.ph h2 { margin: 0; font: 600 26px var(--fh); color: #eafff8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph .sub { color: var(--mu); font-size: 14px; }
.ph .sub a { color: var(--mu); } .ph .sub a:hover { color: var(--gd2); }
.ph > div { min-width: 0; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.card { background: var(--p); border: 1px solid var(--ln); padding: 10px 14px 12px; cursor: pointer; text-align: left; color: var(--tx); font: inherit; min-width: 0; }
.card:hover { border-color: var(--ln2); }
.card.on { border-color: var(--gd); box-shadow: inset 0 0 0 1px rgba(69, 224, 192, .35); background: linear-gradient(var(--p), var(--gdbg)); }
.card .cm { font: 600 13px var(--fb); letter-spacing: .08em; text-transform: uppercase; color: var(--mu); display: flex; justify-content: space-between; gap: 6px; }
.card .cv { font: 600 30px/1.2 var(--fh); color: var(--gd2); margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
.card .cv.cal { font: 400 16px/1.9 var(--fb); color: var(--sf); }
.card .cv.none { color: var(--dim); }
.card .cs { color: var(--mu); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rk { font: 600 15px var(--fh); color: var(--gd2); letter-spacing: 0; text-transform: none; }
.mh { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 22px 0 8px; flex-wrap: wrap; }
.mh h3 { margin: 0; font: 600 19px var(--fh); color: var(--sf); }
.mh .modes { margin: 0; }
.mh .modes button { font-size: 14px; padding: 4px 12px; }
.ms { background: var(--p); border: 1px solid var(--ln); }
.m { display: grid; grid-template-columns: 112px 1fr 128px; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid rgba(30, 90, 82, .45); }
.m:last-child { border-bottom: 0; }
.m .res { font: 600 16px var(--fh); }
.m .res.win { color: var(--ok); } .m .res.loss { color: var(--bd); } .m .res.loss_leave { color: var(--wa); } .m .res.none { color: var(--mu); }
.m .res small { display: block; font: 400 13px var(--fb); color: var(--mu); }
.m .mid { min-width: 0; }
.m .meta { color: var(--mu); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m .teams { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin: 2px 0; }
.m .side { display: inline-flex; flex-wrap: wrap; gap: 2px 10px; }
.m .vs { color: var(--dim); font-size: 13px; }
.m .pp { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.m .pp img { width: 18px; height: 18px; }
.m .pp.me { color: #eafff8; font-weight: 700; }
.m .why { color: var(--mu); font-size: 13px; }
.m .dl { text-align: right; font: 600 18px var(--fh); font-variant-numeric: tabular-nums; white-space: nowrap; }
.m .dl.up { color: var(--ok); } .m .dl.down { color: var(--bd); } .m .dl.zero { color: var(--sf); }
.m .dl small { display: block; font: 400 12px var(--fb); color: var(--mu); }
.m .dl.cal, .m .dl.un { font: 400 13px var(--fb); color: var(--mu); }
@media (max-width: 620px) {
  .top { flex-wrap: wrap; row-gap: 10px; padding-top: 16px; } .top .sp { flex-basis: 100%; height: 0; } .lang { margin-left: auto; }
  .top h1 { font-size: 21px; letter-spacing: 2px; }
  #tableView .modes { display: flex; } #tableView .modes button { flex: 1; padding: 7px 0; font-size: 16px; }
  th, td { padding: 8px 6px; } th { font-size: 11px; letter-spacing: .03em; } .c-n { width: 30px; } .c-r { width: 104px; } .c-g { width: 50px; } .c-wl { width: 78px; }
  td.pl { font-size: 15px; } td.r { font-size: 16px; } td.cal { font-size: 13px; }
  .hide { display: none; }
  .ph h2 { font-size: 21px; } .av { width: 52px; height: 52px; }
  .cards { gap: 6px; } .card { padding: 8px 8px 10px; } .card .cv { font-size: 22px; } .card .cv.cal { font-size: 13px; line-height: 1.5; }
  .card .cs { font-size: 12px; white-space: normal; }
  .m { grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px; }
  .m .res { grid-column: 1; } .m .dl { grid-column: 2; grid-row: 1; } .m .mid { grid-column: 1 / 3; }
  .m .res small { display: inline; margin-left: 6px; }
  .how { padding: 0 12px 12px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1><a href="/ladder/table" id="title">Elite</a></h1><span class="tag" id="tag" hidden></span>
    <span class="sp"></span>
    <div class="lang" id="lang"><button data-l="ru">RU</button><button data-l="en">EN</button></div>
    <a class="btn" href="/" id="home">На главную</a>
  </div>

  <main id="tableView" hidden>
    <div class="modes" id="modes"><button data-m="1v1" class="on">1 vs 1</button><button data-m="2v2">2 vs 2</button><button data-m="3v3">3 vs 3</button></div>
    <table>
      <thead><tr><th class="l c-n">#</th><th class="l" data-t="player"></th><th class="c-r" data-t="rating" data-h="ratingHint"></th>
        <th class="c-g" data-t="games"></th><th class="c-wl hide" data-h="wlHint" data-t="wl"></th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="empty" data-t="loading"></td></tr></tbody>
    </table>
  </main>

  <main id="playerView" hidden>
    <a class="back" id="back" href="/ladder/table" data-t="back"></a>
    <div id="pv"><div class="empty" data-t="loading"></div></div>
  </main>

  <details id="how"><summary data-t="howTitle"></summary><div class="how" id="howText"></div></details>
</div>
<script>
const I18N = {
  ru: { title: 'Рейтинг Elite', home: 'На главную', pre: 'Предсезон', test: 'Тест', player: 'Игрок', rating: 'Рейтинг', games: 'Игр', wl: 'П – П – У',
    ratingHint: 'Осторожный рейтинг: Glicko-2 минус две неопределённости (RD)', wlHint: 'Победы – поражения – поражения за уход',
    cal: (k, n) => `калибровка ${k}/${n}`, loading: 'Загрузка…', empty: 'В этом режиме пока никто не играл.', err: 'Не удалось загрузить.',
    stats: 'Страница игрока', back: '← К таблице', steam: 'Профиль Steam', recent: 'Последние матчи', all: 'Все', noGames: 'нет игр',
    noMatches: 'Матчей пока нет.', place: n => `#${n}`, gamesN: n => `${n} ${plural(n, 'игра', 'игры', 'игр')}`,
    tableNum: c => `Число таблицы после матча: ${c}`, calDone: 'калибровка пройдена', unrated: 'без рейтинга', vs: 'vs', min: 'мин',
    fin: { win: 'Победа', loss: 'Поражение', loss_leave: 'Уход', none: 'Без итога' },
    why: { room: 'комната лаунчера, не автоматч', early_leave: 'выход в первые 3 минуты', no_winner: 'итог не определён', no_data: 'нет данных о выходе игроков',
      no_history: 'нет записи автоматча', all_gone: 'все вышли разом (сбой сети или сервера)', reports_disagree: 'отчёты игр расходятся, на проверке',
      winners_left: 'победители вышли до конца, на проверке', not_full_teams: 'неполные команды', no_steam: 'нет Steam ID',
      short_match: 'матч короче 3 минут (сдача или выход)', void: 'аннулирован вручную', not_elite: 'не Elite (ваниль)' },
    note: { early_forgiven: 'первый ранний выход за сутки — прощён', left_first: 'вышел до конца матча', short_handed: 'играли в меньшинстве — половина потери',
      repeat_pair: 'тот же соперник 4-й раз за сутки — четверть изменения', manual_winner: 'итог исправлен вручную' },
    howTitle: 'Как работает рейтинг',
    how: pre => `
<h3>Рейтинг и неопределённость</h3>
<p>Рейтинг считается по системе <b>Glicko-2</b>. У каждого игрока в каждом режиме два числа: <b>рейтинг</b> — оценка силы, и <b>неопределённость</b> — насколько система в этой оценке уверена. Новичок начинает с 1500 и большой неопределённостью: система о нём ещё ничего не знает.</p>
<p>В таблице показано <b>осторожное число</b>: рейтинг минус две неопределённости. Это уровень, ниже которого вы почти наверняка не играете. Пока игр мало, неопределённость велика и число в таблице ниже рейтинга; с каждой игрой она уменьшается, и число подтягивается к рейтингу. Поэтому серия из нескольких удачных побед не выводит новичка сразу на первое место. Точный рейтинг и неопределённость видны в подсказке у числа.</p>
<h3>Что даёт победа, поражение и уход</h3>
<ul>
<li><b>Победа</b> поднимает рейтинг, <b>поражение</b> опускает.</li>
<li>Насколько — зависит от соперника: победа над более сильным даёт больше, над слабым — меньше; поражение от слабого стоит дороже, чем от сильного.</li>
<li>И от неопределённости: у новичка рейтинг движется быстро, у опытного игрока — спокойнее. Соперник, о котором система мало знает, влияет на ваш рейтинг слабее.</li>
<li>В 2v2 и 3v3 каждый сравнивается со средним рейтингом команды соперника, а изменение у каждого своё — по его рейтингу и неопределённости.</li>
<li>Поэтому изменение за матч у всех разное. На странице игрока у каждого матча показано, как изменилось число в таблице. Пока неопределённость большая, она заметно уменьшается с каждой игрой, и число в таблице может немного вырасти даже после поражения.</li>
<li><b>Уход = поражение.</b> Вышел, вылетел или потерял связь до конца матча — это поражение, даже если команда потом победила (колонка «У» в таблице). Тиммейтам ушедшего, если команда проиграла в меньшинстве, — только половина потери.</li>
</ul>
<h3>Калибровка</h3>
<p>Первые <b>5 игр</b> в режиме рейтинг считается, но не показывается: в таблице написано «калибровка 2/5», такие игроки стоят под рейтинговыми, по алфавиту. После пятой игры рейтинг появляется в таблице.</p>
<h3>Какие матчи не идут в рейтинг</h3>
<ul>
<li>Считаются только матчи <b>нашего автоматча</b> (Find a Game) в <b>Elite</b>. Комнаты лаунчера, кастомки, игры с компьютером и ваниль в рейтинг не идут.</li>
<li><b>Первые 3 минуты.</b> Если кто-то вышел в первые 3 минуты, матч не идёт в рейтинг ни для кого. Первый такой выход за сутки прощается; второй и следующие — поражение тому, кто вышел.</li>
<li>Матч, закончившийся быстрее 3 минут (сдача или выход), тоже не в рейтинге.</li>
<li>Если все отвалились разом (сбой сервера или сети), матч не считается.</li>
<li><b>Одни и те же соперники.</b> Если в 1v1 одна и та же пара играет больше трёх раз за сутки, с 4-го матча рейтинг меняется только на четверть.</li>
<li>Спорные матчи (отчёты игр расходятся, победители вышли до конца) проверяем вручную.</li>
</ul>
<h3>Как подбираются соперники</h3>
<ul>
<li>Автоматч подбирает по этому же рейтингу (по самому рейтингу, не по осторожному числу) — каждому режиму свой.</li>
<li>Сначала ищет соперника с разницей до <b>150</b> очков. С каждой минутой ожидания окно шире на <b>50</b>, а после <b>6 минут</b> подойдёт любой — чтобы никто не ждал бесконечно.</li>
<li>Игроки на калибровке ищутся как 1500, и окно для них шире: система ещё не знает их уровень.</li>
<li>В 2v2 и 3v3 команды делятся так, чтобы их суммарные рейтинги были как можно ближе.</li>
</ul>
<h3>${pre ? 'Предсезон' : 'Сейчас — тест'}</h3>
<p>${pre ? 'Сейчас идёт предсезон: мы проверяем правила в боевых условиях. К старту сезона рейтинги всех игроков обнулятся. Предложения и возражения пишите в Discord или в чат лаунчера.'
          : 'Таблица пока тестовая: мы проверяем правила. Перед стартом рейтинги всех игроков обнулятся.'}</p>` },
  en: { title: 'Elite Rating', home: 'Home', pre: 'Preseason', test: 'Test', player: 'Player', rating: 'Rating', games: 'Games', wl: 'W – L – Lv',
    ratingHint: 'Conservative rating: Glicko-2 minus two uncertainties (RD)', wlHint: 'Wins – losses – losses by leaving',
    cal: (k, n) => `calibration ${k}/${n}`, loading: 'Loading…', empty: 'Nobody has played this mode yet.', err: 'Could not load.',
    stats: 'Player page', back: '← Back to the table', steam: 'Steam profile', recent: 'Recent matches', all: 'All', noGames: 'no games',
    noMatches: 'No matches yet.', place: n => `#${n}`, gamesN: n => `${n} ${n === 1 ? 'game' : 'games'}`,
    tableNum: c => `The table's number after the match: ${c}`, calDone: 'calibration done', unrated: 'unrated', vs: 'vs', min: 'min',
    fin: { win: 'Win', loss: 'Loss', loss_leave: 'Left', none: 'No result' },
    why: { room: 'a launcher room, not the automatch', early_leave: 'a leave in the first 3 minutes', no_winner: 'no result', no_data: 'no data on the leaves',
      no_history: 'no automatch record', all_gone: 'everyone left at once (network or server)', reports_disagree: 'the game reports disagree, under review',
      winners_left: 'the winners left before the end, under review', not_full_teams: 'teams not full', no_steam: 'no Steam ID',
      short_match: 'shorter than 3 minutes (a surrender or a leave)', void: 'voided by an admin', not_elite: 'not Elite (vanilla)' },
    note: { early_forgiven: 'the first early leave in a day, forgiven', left_first: 'left before the end', short_handed: 'played short-handed: half the loss',
      repeat_pair: 'the same opponent a 4th time in a day: a quarter of the change', manual_winner: 'result corrected by an admin' },
    howTitle: 'How the rating works',
    how: pre => `
<h3>Rating and uncertainty</h3>
<p>The rating is <b>Glicko-2</b>. Every player has two numbers in every mode: the <b>rating</b>, an estimate of how strong you are, and the <b>uncertainty</b>, how sure the system is about it. A newcomer starts at 1500 with a large uncertainty: the system knows nothing about him yet.</p>
<p>The table shows a <b>conservative number</b>: the rating minus two uncertainties, a level you almost certainly play at or above. With few games the uncertainty is large and the number is well below the rating; every game makes it smaller and the number closes in on the rating. So a lucky streak of a few wins does not put a newcomer straight on top. The exact rating and uncertainty are in the number's tooltip.</p>
<h3>What a win, a loss and a leave give</h3>
<ul>
<li>A <b>win</b> raises the rating, a <b>loss</b> lowers it.</li>
<li>By how much depends on the opponent: beating a stronger player gives more, a weaker one less; losing to a weaker player costs more than losing to a stronger one.</li>
<li>And on the uncertainty: a newcomer's rating moves fast, a regular's more calmly. An opponent the system knows little about moves your rating less.</li>
<li>In 2v2 and 3v3 each player is compared with the other team's average rating, and each gets his own change, by his own rating and uncertainty.</li>
<li>That is why the change differs from player to player. The player page shows, for every match, how the table's number changed. While the uncertainty is large it shrinks noticeably with every game, so the table's number can even grow a little after a loss.</li>
<li><b>Leaving = losing.</b> Quit, crashed or lost the connection before the end: that is a loss, even if your team then won (the "Lv" column). The leaver's teammates, if their team lost short-handed, lose only half as much.</li>
</ul>
<h3>Calibration</h3>
<p>For your first <b>5 games</b> in a mode the rating is counted but not shown: the table says "calibration 2/5" and lists these players below the rated ones, alphabetically. After the fifth game the rating appears in the table.</p>
<h3>Which matches are not rated</h3>
<ul>
<li>Only matches of <b>our automatch</b> (Find a Game) in <b>Elite</b> count. Launcher rooms, custom games, games against the computer and vanilla are not rated.</li>
<li><b>The first 3 minutes.</b> If someone leaves within the first 3 minutes, the match is not rated for anyone. The first such leave in a day is forgiven; the second and every next one is a loss for the leaver.</li>
<li>A match over in less than 3 minutes (a surrender or a leave) is not rated either.</li>
<li>If everyone dropped at once (a server or network failure), the match does not count.</li>
<li><b>The same opponents.</b> If the same two players meet in 1v1 more than three times a day, from the 4th match on the rating changes by only a quarter.</li>
<li>Disputed matches (the game reports disagree, the winners left before the end) are reviewed by hand.</li>
</ul>
<h3>How opponents are found</h3>
<ul>
<li>The automatch matches by this same rating (the rating itself, not the conservative number), separately for each mode.</li>
<li>It first looks for an opponent within <b>150</b> points. Every minute of waiting widens the window by <b>50</b>, and after <b>6 minutes</b> anyone will do, so nobody waits forever.</li>
<li>Players in calibration are matched as 1500 with a wider window: the system does not know their level yet.</li>
<li>In 2v2 and 3v3 the teams are split so that their total ratings are as close as possible.</li>
</ul>
<h3>${pre ? 'Preseason' : 'A test for now'}</h3>
<p>${pre ? 'This is the preseason: we are testing the rules under battle conditions. When the season starts, everyone’s rating is reset. Suggestions and objections are welcome in Discord or in the launcher’s chat.'
          : 'The table is a test for now: we are checking the rules. Everyone’s rating will be reset before the start.'}</p>` } };
function plural(n, one, few, many) { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; }
const QS = new URLSearchParams(location.search);
let LANG = (() => {
  const q = QS.get('lang'); if (q === 'ru' || q === 'en') return q;
  try { const v = localStorage.getItem('ladderLang'); if (v === 'ru' || v === 'en') return v; } catch (e) {}
  return /^(ru|uk|be|kk)/i.test(navigator.language || '') ? 'ru' : 'en';
})();
const $ = s => document.querySelector(s), T = k => I18N[LANG][k];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const MODES = ['1v1', '2v2', '3v3'], okMode = m => MODES.includes(m) ? m : null;
const PSTEAM = (location.pathname.match(/^\/ladder\/player\/(\d{5,20})\/?$/) || [])[1] || '';
// the mode: ?mode=2v2, or the old #2v2 (the page's links before /ladder/table); #how opens the rules
let MODE = okMode(QS.get('mode')) || okMode(location.hash.slice(1)) || '1v1';
let PMODE = okMode(QS.get('mode')) || '';        // the player page's match filter ('' = all modes)
let DATA = null, PDATA = null, SEQ = 0, PRE = false;
const A = '/elite/assets/'; let ASSETS = { races: {}, maps: {} };
const keepLang = () => QS.get('lang') ? '&lang=' + LANG : '';
const tableUrl = m => '/ladder/table?mode=' + m + keepLang();
const playerUrl = (s, m) => '/ladder/player/' + encodeURIComponent(s) + '?mode=' + (m || MODE) + keepLang();

function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach(e => { const v = T(e.dataset.t); if (typeof v === 'string') e.textContent = v; });
  document.querySelectorAll('[data-h]').forEach(e => { e.title = T(e.dataset.h); });
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
  $('#title').textContent = T('title'); $('#home').textContent = T('home');
  $('#howText').innerHTML = T('how')(PRE);
  document.title = (PSTEAM && PDATA && PDATA.name ? PDATA.name + ' — ' : '') + T('title') + ' — Dawn of War II';
  render(); renderPlayer();
}
function setTag(pre) {
  if (pre !== PRE) { PRE = pre; $('#howText').innerHTML = T('how')(PRE); }
  const tag = $('#tag'); tag.hidden = false; tag.textContent = PRE ? T('pre') : T('test');
}

// ---------- the table ----------
function render() {
  if (PSTEAM) return;
  const tb = $('#rows');
  if (!DATA) return;
  if (DATA.error) { tb.innerHTML = `<tr><td colspan="5" class="empty">${esc(T('err'))}</td></tr>`; return; }
  setTag(!!DATA.preseason);
  const rows = DATA.rows || [];
  if (!rows.length) { tb.innerHTML = `<tr><td colspan="5" class="empty">${esc(T('empty'))}</td></tr>`; return; }
  let html = '', sep = false;
  for (const p of rows) {
    const first = p.calibrating && !sep && html; if (p.calibrating) sep = true;
    const link = `<a href="${playerUrl(p.steam)}" title="${esc(T('stats'))}">${esc(p.name || p.steam)}</a>`;
    const wl = `<span>${p.wins}</span>–<span>${p.losses}</span>–<span class="lv">${p.leaves}</span>`;
    html += p.calibrating
      ? `<tr class="calrow${first ? ' firstcal' : ''}"><td class="l n">—</td><td class="l pl">${link}</td><td class="cal">${esc(T('cal')(p.cal_played, p.cal_needed))}</td><td>${p.games}</td><td class="wl hide">${wl}</td></tr>`
      : `<tr><td class="l n${p.rank <= 3 ? ' t' + p.rank : ''}">${p.rank}</td><td class="l pl">${link}</td><td class="r" title="${esc(p.rating + ' ± ' + p.rd)}">${p.cons}</td><td>${p.games}</td><td class="wl hide">${wl}</td></tr>`;
  }
  tb.innerHTML = html;
}
async function load() {
  const my = ++SEQ;
  if (!DATA) $('#rows').innerHTML = `<tr><td colspan="5" class="empty">${esc(T('loading'))}</td></tr>`;
  try {
    const r = await fetch('/ladder/api/own?' + new URLSearchParams({ mode: MODE }));
    const d = await r.json();
    if (my !== SEQ) return;
    DATA = r.ok ? d : { error: true };
  } catch (e) { if (my === SEQ) DATA = { error: true }; }
  render();
}
function syncModes() { document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.m === MODE)); }
$('#modes').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.dataset.m === MODE) return; MODE = b.dataset.m;
  history.replaceState(null, '', tableUrl(MODE) + (location.hash === '#how' ? '#how' : '')); syncModes(); DATA = null; load(); });

// ---------- the player page ----------
function hDate(t) { return new Date(t * 1000).toLocaleString(LANG === 'ru' ? 'ru-RU' : 'en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }
function mapTitle(k) { const m = ASSETS.maps[k]; return esc(m && m.name ? m.name.replace(/^\(\d+p\)\s*/, '') : String(k || '').replace(/^\d+p_/, '').replace(/_/g, ' ')); }
function raceImg(k) { const r = k && ASSETS.races[k]; return r ? `<img src="${A + r.icon}" alt="" title="${esc(r.name)}">` : ''; }
function card(m) {
  const r = (PDATA.ratings || []).find(x => x.mode === m && x.season === PDATA.season);
  let v, s1 = '', s2 = '';
  if (!r) v = `<div class="cv none">—</div>`, s1 = esc(T('noGames'));
  else {
    if (r.cons != null) v = `<div class="cv" title="${esc(r.rating + ' ± ' + r.rd)}">${r.cons}</div>`, s1 = `${esc(r.rating)} ± ${esc(r.rd)}`;
    else v = `<div class="cv cal">${esc(T('cal')(r.games, PDATA.cal_games || 5))}</div>`;
    s2 = `<span title="${esc(T('wlHint'))}">${r.wins}–${r.losses}–<span class="lv" style="color:var(--wa)">${r.leaves}</span></span> · ${esc(T('gamesN')(r.games))}`;
  }
  const rk = r && r.rank ? `<span class="rk${r.rank <= 3 ? ' t' + r.rank : ''}">${esc(T('place')(r.rank))}</span>` : '';
  return `<button class="card${PMODE === m ? ' on' : ''}" data-m="${m}"><div class="cm"><span>${m.replace('v', ' vs ')}</span>${rk}</div>${v}
    ${s1 ? `<div class="cs">${s1}</div>` : ''}${s2 ? `<div class="cs">${s2}</div>` : ''}</button>`;
}
function matchRow(m) {
  const me = m.me || {}, f = me.final || 'none', why = [];
  const notes = [...new Set((me.note || '').split(',').map(n => /^left_/.test(n) ? 'left_first' : n).filter(n => T('note')[n]))];   // left_36s_before_end
  notes.forEach(n => why.push(T('note')[n]));
  const counted = me.n != null;                                   // it moved his rating (rated, or his own loss for an early leave)
  if (!m.rated) why.push(T('unrated') + ': ' + ((m.why && T('why')[m.why]) || m.why || '—'));
  const pp = p => `<span class="pp${p.steam === PSTEAM ? ' me' : ''}">${raceImg(p.race)}${p.steam === PSTEAM ? esc(p.name || p.steam)
    : `<a class="pa" href="${playerUrl(p.steam, m.mode)}">${esc(p.name || p.steam)}</a>`}</span>`;
  const mine = m.teams.find(tm => tm.some(p => p.steam === PSTEAM)) || [], other = m.teams.filter(tm => tm !== mine);
  const teams = `<span class="side">${mine.map(pp).join('')}</span>` + other.map(tm => `<span class="vs">${esc(T('vs'))}</span><span class="side">${tm.map(pp).join('')}</span>`).join('');
  let dl;
  if (!counted) dl = `<div class="dl un">${esc(T('unrated'))}</div>`;
  else if (me.d != null) dl = `<div class="dl ${me.d > 0 ? 'up' : me.d < 0 ? 'down' : 'zero'}" title="${esc(T('tableNum')(me.c))}">${me.d > 0 ? '+' + me.d : me.d < 0 ? '−' + (-me.d) : '±0'}<small>${me.c}</small></div>`;
  else if (me.c != null) dl = `<div class="dl zero" title="${esc(T('calDone'))}">${me.c}<small>${esc(T('calDone'))}</small></div>`;
  else dl = `<div class="dl cal">${esc(T('cal')(Math.min(me.n, PDATA.cal_games || 5), PDATA.cal_games || 5))}</div>`;
  const dur = m.ended && m.started ? Math.round((m.ended - m.started) / 60) : null;
  return `<div class="m"><div class="res ${f}">${esc(T('fin')[f] || f)}<small>${esc(m.mode || '')}</small></div>
    <div class="mid"><div class="meta">${hDate(m.started)} · ${mapTitle(m.map)}${dur != null ? ' · ' + dur + ' ' + esc(T('min')) : ''}</div><div class="teams">${teams}</div>
    ${why.length ? `<div class="why">${why.map(esc).join(' · ')}</div>` : ''}</div>${dl}</div>`;
}
function renderPlayer() {
  if (!PSTEAM) return;
  const v = $('#pv'); $('#back').href = tableUrl(PMODE || MODE);
  if (!PDATA) return;
  if (PDATA.error) { v.innerHTML = `<div class="empty">${esc(T('err'))}</div>`; return; }
  setTag(!!PDATA.preseason);
  const name = PDATA.name || PSTEAM;
  document.title = name + ' — ' + T('title') + ' — Dawn of War II';
  const av = PDATA.avatar ? `<img class="av" src="${esc(PDATA.avatar)}" alt="">` : `<div class="av">${esc(name.slice(0, 1).toUpperCase())}</div>`;
  const ms = (PDATA.matches || []).filter(m => !PMODE || m.mode === PMODE);
  v.innerHTML = `<div class="ph">${av}<div><h2>${esc(name)}</h2><div class="sub"><a href="https://steamcommunity.com/profiles/${esc(PSTEAM)}" target="_blank" rel="noopener">${esc(T('steam'))} ↗</a></div></div></div>
    <div class="cards">${MODES.map(card).join('')}</div>
    <div class="mh"><h3>${esc(T('recent'))}</h3><div class="modes" id="pmodes">${['', ...MODES].map(m => `<button data-m="${m}" class="${PMODE === m ? 'on' : ''}">${m ? m.replace('v', ' vs ') : esc(T('all'))}</button>`).join('')}</div></div>
    <div class="ms">${ms.length ? ms.map(matchRow).join('') : `<div class="empty">${esc(T('noMatches'))}</div>`}</div>`;
}
async function loadPlayer() {
  try {
    if (!Object.keys(ASSETS.maps || {}).length) { try { ASSETS = await (await fetch(A + 'index.json')).json(); } catch (e) {} }
    const r = await fetch('/ladder/api/own/player?steam=' + encodeURIComponent(PSTEAM));
    PDATA = r.ok ? await r.json() : { error: true };
    if (!PDATA.error && !QS.get('mode')) {            // no mode asked: the mode he has played most this season
      const rs = (PDATA.ratings || []).filter(x => x.season === PDATA.season).sort((a, b) => b.games - a.games);
      PMODE = rs.length > 1 ? '' : (rs[0] && rs[0].mode) || '';
    }
  } catch (e) { PDATA = { error: true }; }
  renderPlayer();
}
$('#pv').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (!b) return;
  PMODE = PMODE === b.dataset.m && b.classList.contains('card') ? '' : b.dataset.m; if (PMODE) MODE = PMODE;
  history.replaceState(null, '', PMODE ? playerUrl(PSTEAM, PMODE) : '/ladder/player/' + PSTEAM + (QS.get('lang') ? '?lang=' + LANG : '')); renderPlayer(); });

// ---------- the rules (#how) ----------
function openHow() { if (location.hash === '#how') { const d = $('#how'); d.open = true; setTimeout(() => d.scrollIntoView({ block: 'start' }), 0); } }
$('#how').addEventListener('toggle', () => { const want = $('#how').open ? '#how' : ''; if (location.hash !== want && (want || location.hash === '#how'))
  history.replaceState(null, '', location.pathname + location.search + want); });
window.addEventListener('hashchange', openHow);
$('#lang').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; LANG = b.dataset.l;
  if (QS.get('lang')) { QS.set('lang', LANG); history.replaceState(null, '', location.pathname + '?' + QS + location.hash); }
  try { localStorage.setItem('ladderLang', LANG); } catch (er) {} applyLang(); });

if (PSTEAM) { $('#playerView').hidden = false; applyLang(); loadPlayer(); }
else {
  $('#tableView').hidden = false;
  if (/^#[123]v[123]$/.test(location.hash)) history.replaceState(null, '', tableUrl(MODE));   // the old #2v2 links
  syncModes(); applyLang(); load(); setInterval(load, 60000);
}
openHow();
</script>
</body>
</html>
