     the phone's drawer (ladder-hdr.css + ladder-hdr.js, everything under .hdr). 18.11.2026 (SirItos: "the chat must not stand out"):

<body>
<header class="hdr">
  <button class="burger" id="burger" type="button" aria-controls="menu" aria-expanded="false" title="Меню" data-ht="menuT"><i></i></button>
  <a class="brand" href="/ladder/" aria-label="Elite Ladder — Dawn of War II"><span class="dd-logo" aria-hidden="true"><b class="dd-ii">II</b><span class="dd-w">Dawn <em>of</em> War</span><span class="dd-sub">Elite Ladder</span></span></a>
  <div class="menu" id="menu">
    <div class="hme" id="hdrMe" hidden></div>
    <nav class="tabs"><a class="tab" href="/ladder/" data-ht="tabTable">Рейтинг</a><a class="tab" href="/ladder/?view=history" data-ht="tabHistory">История матчей</a><a class="tab" href="/ladder/?view=live" data-ht="tabLive">Идущие матчи</a><a class="tab on" href="/ladder/chat" aria-current="page" data-ht="chatLink">Чат</a></nav>
    <div class="hdr-r">

</header>
<div class="wrap">
  <header>
    <h1>Общий чат</h1>
    <a id="lv" class="lv" href="/elite/" title="Скачать актуальную версию лаунчера" style="display:none"></a>
  </header>

  <div id="online" class="online" style="display:none"></div>

  <div class="rooms" id="tabs">
    <button data-room="all" class="on">Общий</button>
    <button data-room="ru">RU</button>
    <button data-room="en">EN</button>
  </div>

  <div class="msgs" id="msgs"><div class="empty">Загрузка…</div></div>

  <div class="foot">
    <div id="signin" class="signin" style="display:none">
      <p>Войдите через Steam, чтобы писать в чат.</p>
      <button class="steam" id="steamBtn">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-9.9 8.6l5.3 2.2a2.8 2.8 0 0 1 1.6-.5h.1l2.4-3.4v-.1a3.7 3.7 0 1 1 3.7 3.7h-.1l-3.4 2.4v.1a2.8 2.8 0 0 1-5.5.8L2 18.2A10 10 0 1 0 12 2zM8.6 17.2l-1.3-.5a2.1 2.1 0 0 0 3.9-.2 2.1 2.1 0 0 0-2.8-2l1.3.6a1.5 1.5 0 1 1-1.1 2.1zm8.3-6.3a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zm0-.8a1.7 1.7 0 1 1 0-3.4 1.7 1.7 0 0 1 0 3.4z"/></svg>
        Войти через Steam
      </button>
    </div>
    <div id="rbar" class="rbar" role="status" style="display:none"></div>
    <div id="composer" class="send" style="display:none">
      <textarea id="txt" rows="2" maxlength="500" placeholder="Сообщение… (Enter — отправить, Shift+Enter — перенос)"></textarea>
      <button id="sendBtn">Отправить</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const api = (path, opt) => fetch('/ladder/api/c/' + path, Object.assign({ credentials: 'same-origin', cache: 'no-store' }, opt)).then(r => r.json());
let toastT;
function toast(msg, ok) { const t = $('toast'); t.textContent = msg; t.className = 'toast on' + (ok ? ' ok' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', 3500); }

const PAGE = 20;   // last 20 on first load; older pulled in on scroll-up
const CH = { room: 'all', me: null, last: {}, first: {}, lists: {}, noMore: {}, busy: {}, features: [], replyTo: null };
try { CH.room = localStorage.getItem('chRoom') || 'all'; } catch (e) {}

function avatar(src) { return src ? `<img src="${esc(src)}" alt="" loading="lazy">` : `<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="">`; }
function when(ts) { const d = new Date(ts * 1000); const now = new Date(); const t = d.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
  return d.toDateString() === now.toDateString() ? t : d.toLocaleDateString('ru', { day: '2-digit', month: '2-digit' }) + ' ' + t; }
// <linkify> 18.11.2026 (SirItos, the same in the launcher's chat): links in the messages, at render time only (the text stays plain, so the
// old messages get them too). Only http(s):// and bare www. addresses (-> https://), up to 500 characters; the sentence's punctuation
// after one is not its part (a ")" stays when the address opened a "("). The plain parts go through fmt (escape + @mentions) and the
// link through esc alone - a mention never breaks a link with "@" in it. Shown short (no scheme, ~60 characters), the whole in title.
// tests: ladder/tests/test_chat_links.js
function linkify(text, fmt, link) {
  const s = String(text == null ? '' : text), re = /(^|[^\w@/.-])((?:https?:\/\/|www\.)[^\s<>"'`«»]+)/gi;
  let out = '', last = 0, m;
  while ((m = re.exec(s))) {
    let u = m[2];
    while (u) {
      const c = u[u.length - 1];
      if (c === ')' && u.split('(').length >= u.split(')').length) break;
      if (!'.,;:!?)]»"\''.includes(c)) break;
      u = u.slice(0, -1);
    }
    const href = /^www\./i.test(u) ? 'https://' + u : u, host = href.replace(/^https?:\/\//i, '').split(/[/?#]/)[0].replace(/^[^@]*@/, '').replace(/:\d+$/, '');
    if (u.length > 500 || !/^[^.\s]+(\.[^.\s]+)+$/.test(host)) continue;
    const start = m.index + m[1].length, shown = Array.from(u.replace(/^https?:\/\//i, ''));
    out += fmt(s.slice(last, start)) + link(href, shown.length > 60 ? shown.slice(0, 57).join('') + '…' : shown.join(''));
    last = re.lastIndex = start + u.length;
  }
  return out + fmt(s.slice(last));
}
// </linkify>
const linkA = (href, shown) => `<a class="lk" href="${esc(href)}" title="${esc(href)}" target="_blank" rel="noopener noreferrer nofollow ugc">${esc(shown)}</a>`;
function body(text) { return linkify(text, p => esc(p).replace(/(^|\s)(@[^\s@]{1,32})/g, (m, s, a) => s + '<span class="at">' + a + '</span>'), linkA); }

// Reply: only on a server that says it can (msgs: features ["reply"]) and only signed in, like sending. The message goes with
// reply_to and comes back with the quote of its original (reply: {id, steam, name, text, ru, en} or {id, deleted}); a click on
// the quote scrolls to the original (older pages pulled in for it, up to 5) and lights it up.
const ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5A5.5 5.5 0 0 1 20 14.5v0A5.5 5.5 0 0 1 14.5 20H12"/></svg>';
const replyOn = () => (CH.features || []).includes('reply') && !!(CH.me && CH.me.signed_in);
const quoteText = q => (CH.room === 'ru' ? q.ru : CH.room === 'en' ? q.en : null) || q.text || '';
function setFeatures(f) {
  if (!Array.isArray(f)) return;
  const was = replyOn(); CH.features = f;
  if (was !== replyOn()) { if (!replyOn()) CH.replyTo = null; renderReplyBar(); renderMsgs(); }
}
function renderReplyBar() {
  const b = $('rbar'), r = replyOn() ? CH.replyTo : null;
  b.style.display = r ? 'flex' : 'none';
  if (!r) { b.innerHTML = ''; return; }
  b.innerHTML = `${ARROW}<span class="rb-t">Ответ <b>${esc(r.name)}</b>: <span>${esc(r.text)}</span></span>`
    + `<button type="button" id="rbarX" title="Отменить ответ (Esc)" aria-label="Отменить ответ (Esc)">×</button>`;
  $('rbarX').onclick = () => { CH.replyTo = null; renderReplyBar(); $('txt').focus(); };
}
function replyStart(id) {
  if (!replyOn()) { toast('Войдите, чтобы писать'); return; }
  const m = (CH.lists[CH.room] || []).find(x => String(x.id) === String(id)); if (!m) return;
  CH.replyTo = { id: m.id, name: m.name || 'Player', text: String(m.text || '').slice(0, 140) };
  renderReplyBar(); $('txt').focus();
}
async function gotoMsg(id) {
  const box = $('msgs'), r = CH.room;
  for (let i = 0; i < 6; i++) {
    const el = box.querySelector(`.m[data-id="${CSS.escape(String(id))}"]`);
    if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); return; }
    const list = CH.lists[r] || [];
    if (CH.noMore[r] || !list.length || list[0].id < id || r !== CH.room) return;   // not in the history any more
    await loadOlder(r);
  }
}

// 25.11.2026 (SirItos): who I am and Sign out are in the header (ladder-hdr.js) - here only the sign-in card or the input
function renderMe() {
  const m = CH.me && CH.me.signed_in ? CH.me : null;
  if (!m) CH.replyTo = null;
  renderReplyBar();
  $('signin').style.display = m ? 'none' : 'block';
  $('composer').style.display = m ? 'flex' : 'none';
}

// ---------- 25.11.2026 (SirItos: "no place icons and so on"): the launcher chat's marks by the names ----------
// the Elite table's top three (/ladder/api/own/all, every 2 min): one badge per mode, the mode's army, the place's metal (badges.css)
const MODES = ['1v1', '2v2', '3v3'], TOPN = { '1v1': ['Капитан', 'Ветеран'], '2v2': ['Лорд-генерал', 'Комиссар'], '3v3': ['Варбосс', 'Ноб'] };
function badges(steam) {
  const e = CH.own && steam ? CH.own[String(steam)] : null; if (!e) return '';
  return MODES.map(m => { const r = e[m] && e[m].rank; if (!r || r > 3) return '';
    const t = TOPN[m][r === 1 ? 0 : 1] + ' · ' + r + '-е место в ' + m;
    return `<a class="rt-b m${m} r${r}" href="/ladder/table?mode=${m}" title="${esc(t)}" aria-label="${esc(t)}"></a>`; }).join('');
}
// the Hall of Fame (/elite/fame.json): a purity seal left of the name; a person with a SteamID is found by it only, else by the name
const SEAL = '<svg viewBox="0 0 20 30" aria-hidden="true"><path d="M6.4 14.5L4.6 29.2l2.3-1.3 1.6 1.7 1-14.3z" fill="#e7dab8"/><path d="M10.6 15.3l1 14.3 1.6-1.7 2.3 1.3-1.8-14.7z" fill="#d9c79b"/><path d="M10 .7l2.7 1.5 3 .6 1.1 2.9 1.9 2.4-1 2.9-.1 3.1-2.6 1.6-2 2.3-3-.5-3 .5-2.1-2.3-2.6-1.6-.1-3.1-1-2.9 1.9-2.4 1.1-2.9 3-.6z" fill="#a3221d" stroke="#4e0b09" stroke-width=".6"/><circle cx="10" cy="9.6" r="5.5" fill="#8a1814" stroke="#cf4b3f" stroke-width=".6"/><path d="M7.6 6.6h4.8M7.6 12.6h4.8M10 6.6v6" stroke="#e8786a" stroke-width="1.25"/></svg>';
const fameKey = n => String(n || '').trim().toLowerCase();
function seal(steam, name) {
  const F = CH.fame; if (!F) return '';
  const p = (steam && F.bySteam.get(String(steam))) || F.byName.get(fameKey(name)); if (!p) return '';
  const tx = o => o ? (o.ru || o.en || '') : '', t = 'Зал славы' + (tx(p.role) ? ': ' + tx(p.role) : '') + (tx(p.short) ? '\n' + tx(p.short) : '');
  return `<a class="seal" href="/elite/fame/" title="${esc(t)}" aria-label="${esc('Зал славы: ' + (p.name || ''))}">${SEAL}</a>`;
}
async function loadMarks(first) {
  try { const d = await (first && window._oa ? window._oa : fetch('/ladder/api/own/all').then(r => r.json())); if (d && d.players) CH.own = d.players; } catch (e) {}
  if (first) try {
    const d = await fetch('/elite/fame.json', { cache: 'no-cache' }).then(r => r.json()), F = { bySteam: new Map(), byName: new Map() };
    for (const p of (d && d.people) || []) { const ids = [].concat(p.steam || []).map(String).filter(x => /^\d{1,20}$/.test(x));
      ids.forEach(x => F.bySteam.set(x, p)); if (!ids.length && fameKey(p.name)) F.byName.set(fameKey(p.name), p); }
    CH.fame = F;
  } catch (e) {}
  renderMsgs(); renderOnline(CH.online);
}

// 20.11.2026 (SirItos: one number everywhere): a player's 1v1 as the site's table shows it (our own rating, mean - 2*RD; calibration
// k/5), Relic's number only when he has no own one - marked R. {n: the short number, t: the line for the tip}
function chRate(u) {
  // the stream's own card (player_own: {modes: {1v1: {conservative, calibrating, cal_played, cal_needed}}}) or the online list's
  // (card_own: {1v1: {rating = the conservative one, calibrating, cal_played}})
  const o = u && u.own, e = o && (o.modes ? o.modes['1v1'] : o['1v1']);
  const c = e ? ('conservative' in e ? e.conservative : e.rating) : null, k = (e && e.cal_needed) || 5;
  if (e && c != null && !e.calibrating) return { n: String(c), t: 'Elite 1v1: ' + c };
  if (e && e.calibrating) return { n: (e.cal_played || 0) + '/' + k, t: 'Elite 1v1: калибровка ' + (e.cal_played || 0) + '/' + k };
  return u && u.rating ? { n: (Number(u.rating) | 0) + ' R', t: 'Relic 1v1: ' + (Number(u.rating) | 0) } : { n: '', t: '' };
}
function renderOnline(list) {
  const box = $('online'); CH.online = list;
  if (!list || !list.length) { box.style.display = 'none'; return; }
  const chips = list.map(u => {
    const ingame = u.state && u.state !== 'menu';   // 'game'/'match'/… = в игре, 'menu' = в меню
    const r = chRate(u), rt = r.n ? `<span class="rt">${esc(r.n)}</span>` : '';
    const tip = (u.name || u.steam) + (r.t ? ' · ' + r.t : '') + (ingame ? ' · в игре' : '');
    return `<span class="ou${ingame ? ' in' : ''}" data-nm="${esc(u.name || 'Player')}" title="${esc(tip)} · клик — ответить">${avatar(u.avatar)}${seal(u.steam, u.name)}<span class="on">${esc(u.name || 'Player')}</span>${badges(u.steam)}${rt}</span>`;
  }).join('');
  box.innerHTML = `<div class="ohdr"><span class="dot"></span>Онлайн · ${list.length}</div><div class="olist">${chips}</div>`;
  box.style.display = 'block';
}

async function pingOnline() {
  let list;
  if (CH.me && CH.me.signed_in) {   // signed-in: hello registers our presence AND returns the list
    try { const r = await api('hello', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ state: 'menu' }) }); list = r && r.online; } catch (e) {}
  }
  if (!list) { try { const r = await api('online'); list = r && r.online; } catch (e) {} }
  if (list) renderOnline(list);
}

// 25.11.2026 (SirItos: "the paging on scroll is crooked"): the PAGE scrolls (18.11: the list in a box of its own was too small on a
// phone), so every "where am I" is the window's: at the start and while the reader is at the bottom the page follows the newest message;
// older ones come in above as the list's top nears the view (an observer on the "earlier" button, which stays as a button too) and the
// page is moved down by what came in, so the eye stays on the same message
const pageEl = () => document.scrollingElement || document.documentElement;
const atBottom = () => { const e = pageEl(); return e.scrollTop + window.innerHeight >= e.scrollHeight - 120; };
const toBottom = () => { const e = pageEl(); e.scrollTop = e.scrollHeight; };
// a heading for every day: Сегодня, Вчера, 24 ноября (with the year when it is not this one) - as the launcher's chat
const dayKey = ts => { const d = new Date(ts * 1000); return d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate(); };
function dayName(ts) {
  const d = new Date(ts * 1000), now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === now.toDateString()) return 'Сегодня';
  if (d.toDateString() === y.toDateString()) return 'Вчера';
  return d.toLocaleDateString('ru', d.getFullYear() === now.getFullYear() ? { day: 'numeric', month: 'long' } : { day: 'numeric', month: 'long', year: 'numeric' });
}
const hm = ts => new Date(ts * 1000).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
const ALL = /(^|[^\p{L}\p{N}_])@all(?![\p{L}\p{N}_])/iu;
function renderMsgs(opts) {
  opts = opts || {};
  const list = CH.lists[CH.room] || [];
  const box = $('msgs'), follow = !opts.keepTop && (opts.toEnd || atBottom());
  const prevH = pageEl().scrollHeight, prevTop = pageEl().scrollTop;
  const top = CH.noMore[CH.room] || !list.length ? '' : '<button class="older" id="older" type="button">↑ Показать более ранние сообщения</button>';
  const mine = CH.me && CH.me.signed_in ? String(CH.me.steam || '') : '', myName = mine ? String(CH.me.name || '') : '', rOn = replyOn();
  // @mentions: the names of this list (longest first, so "@Ab Cd" wins over "@Ab"), mine lit brighter, @all as a mention of everybody
  const names = [...new Set(list.map(x => x.name).filter(Boolean))].sort((a, b) => b.length - a.length);
  const at = html => names.reduce((h, n) => h.split('@' + esc(n)).join(`\u0000${n === myName ? 1 : 0}${esc(n)}\u0001`), html)
    .replace(/\u0000([01])([^\u0001]*)\u0001/g, (_, me, n) => `<span class="at${me === '1' ? ' me' : ''}">@${n}</span>`)
    .replace(new RegExp(ALL.source, 'giu'), '$1<span class="at me">@all</span>');
  const quote = q => !q ? '' : q.deleted ? `<div class="rq del"><i>Сообщение удалено</i></div>`
    : `<div class="rq" data-goto="${esc(String(q.id))}" role="button" tabindex="0" title="Показать сообщение"><b>${esc(q.name || 'Player')}</b><i>${esc(quoteText(q))}</i></div>`;
  let day = null, who = null;   // who: the author of the message above (a stack goes on while it is the same one)
  box.innerHTML = list.length ? top + list.map(x => {
    const own = mine && String(x.steam) === mine, orig = x.orig || x.text, tx = String(x.text || '');
    const toMe = mine && !own && ((x.reply && !x.reply.deleted && String(x.reply.steam) === mine)   // a reply to me, @me or @all: lit
      || (myName && tx.toLowerCase().includes('@' + myName.toLowerCase())) || ALL.test(tx));
    const rpl = rOn && x.id && !own ? `<button class="rpl" data-reply="${esc(String(x.id))}" title="Ответить" aria-label="Ответить">${ARROW}</button>` : '';
    const k = dayKey(x.ts), head = k !== day ? `<div class="day"><span>${esc(dayName(x.ts))}</span></div>` : '';
    const by = String(x.steam || x.name || ''), cont = k === day && who === by; day = k; who = by;
    const tr = orig && orig !== tx ? ` title="${esc('Оригинал: ' + orig)}"` : '';   // a translated tab: the original on hover
    const when = esc(new Date(x.ts * 1000).toLocaleString('ru')), cls = `m${own ? ' mine' : ''}${toMe ? ' tome' : ''}`;
    const body = quote(x.reply) + `<div class="t${tr ? ' tr' : ''}"${tr}>${linkify(tx, p => at(esc(p)), linkA)}</div>`;
    // 27.11.2026 (SirItos, as the launcher 1.6.36): one author's messages in a row are a stack (Discord / Telegram) - the avatar and
    // the name once, at its top, until another player writes; each message keeps its Reply (the arrow at the row's right edge) and
    // its time (in the avatar's column on hover)
    if (cont) return `<div class="${cls} cont" data-id="${esc(String(x.id))}"><span class="gt" title="${when}">${hm(x.ts)}</span><div class="b">${body}</div>${rpl}</div>`;
    return head + `<div class="${cls}" data-id="${esc(String(x.id))}">${avatar(x.avatar)}<div class="b"><div class="h">${seal(x.steam, x.name)}<b class="nk" data-nm="${esc(x.name || 'Player')}">${esc(x.name || 'Player')}</b>${badges(x.steam)}<span class="tm" title="${when}">${hm(x.ts)}</span></div>`
      + body + `</div>${rpl}</div>`;
  }).join('') : `<div class="empty">Пока никто не писал. Будьте первым.</div>`;
  if (opts.keepTop) pageEl().scrollTop = prevTop + pageEl().scrollHeight - prevH;   // older ones above: the same message stays in view
  else if (follow) toBottom();
  watchOlder();
}
// the "earlier" button coming near the view (300 px before) pulls the older page in - once per button (a new one is drawn after it)
let olderIO = null;
function watchOlder() {
  if (!('IntersectionObserver' in window)) return;
  olderIO = olderIO || new IntersectionObserver(es => { if (es.some(e => e.isIntersecting) && CH.ready) loadOlder(CH.room); }, { rootMargin: '300px 0px 0px 0px' });
  olderIO.disconnect(); const o = $('older'); if (o) olderIO.observe(o);
}

// new messages (first load with ?limit, then polling with ?after)
async function load(room) {
  const r = room || CH.room;
  const q = CH.last[r] ? `after=${CH.last[r]}` : `after=0&limit=${PAGE}`;
  let d; try { d = await api(`msgs?room=${r}&${q}`); } catch (e) { return; }
  if (!d || !d.msgs) return;
  const firstLoad = !CH.last[r];
  const list = CH.lists[r] || (CH.lists[r] = []);
  let added = false;
  d.msgs.forEach(m => {
    if (!list.some(x => x.id === m.id)) { list.push(m); added = true; }
    CH.last[r] = Math.max(CH.last[r] || 0, m.id);
    CH.first[r] = CH.first[r] ? Math.min(CH.first[r], m.id) : m.id;
  });
  // the whole history fits in the first page - only the common tab can tell: a translated one may be cut short at a message still
  // being translated (community._cut), its older pages say it themselves
  if (firstLoad && r === 'all' && d.msgs.length < PAGE) CH.noMore[r] = true;
  setFeatures(d.features);   // Reply only where the server can do it
  if ((added || firstLoad) && r === CH.room) renderMsgs(firstLoad ? { toEnd: true } : undefined);
}

// scroll-up paging: pull the PAGE messages just before the oldest we hold
async function loadOlder(r) {
  r = r || CH.room;
  if (CH.busy[r] || CH.noMore[r] || !CH.first[r]) return;
  CH.busy[r] = true;
  let d; try { d = await api(`msgs?room=${r}&before=${CH.first[r]}&limit=${PAGE}`); } catch (e) { CH.busy[r] = false; return; }
  const list = CH.lists[r] || (CH.lists[r] = []);
  const older = (d && d.msgs || []).filter(m => !list.some(x => x.id === m.id));
  if (older.length) {
    CH.lists[r] = older.concat(list);
    CH.first[r] = Math.min(CH.first[r], ...older.map(m => m.id));
    if (r === CH.room) renderMsgs({ keepTop: true });
  }
  if (!d || !d.msgs || d.msgs.length < PAGE) CH.noMore[r] = true;
  CH.busy[r] = false;
  if (!older.length && r === CH.room) renderMsgs({ keepTop: true });   // nothing new: the button back (or gone at the start of history)
}

async function send() {
  const el = $('txt'), text = el.value.trim();
  if (!text) return;
  $('sendBtn').disabled = true; el.value = '';
  const rt = replyOn() && CH.replyTo ? CH.replyTo.id : 0;
  try {
    const r = await api('say', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ room: CH.room, text }, rt ? { reply_to: rt } : {})) });
    if (r && r.ok) { if (CH.replyTo && CH.replyTo.id === rt) { CH.replyTo = null; renderReplyBar(); } await load(CH.room); toBottom(); }
    else { el.value = text; toast((r && r.error) || 'Не отправлено'); }
  } catch (e) { el.value = text; toast('Сеть недоступна'); }
  $('sendBtn').disabled = false; el.focus();
}

function signIn() {
  let nonce = ''; const a = new Uint8Array(24);
  (crypto.getRandomValues ? crypto.getRandomValues(a) : a).forEach(b => nonce += b.toString(16).padStart(2, '0'));
  if (nonce.length < 16) nonce = String(Date.now()) + Math.random().toString(16).slice(2);
  location.href = '/ladder/api/c/login?nonce=' + nonce + '&to=' + encodeURIComponent('/ladder/chat');
}

// tabs
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  CH.room = b.dataset.room; try { localStorage.setItem('chRoom', CH.room); } catch (e) {}
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  renderMsgs({ toEnd: true }); load();
});
// 20.11.2026: "Show earlier" is a button too (and the observer above loads them as it comes near the view)
$('msgs').addEventListener('click', e => { if (e.target.closest && e.target.closest('#older')) { e.target.closest('#older').disabled = true; loadOlder(CH.room); } });
document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.room === CH.room));

$('steamBtn').onclick = signIn;
$('sendBtn').onclick = send;
$('txt').onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  else if (e.key === 'Escape' && CH.replyTo) { e.preventDefault(); CH.replyTo = null; renderReplyBar(); }
};
function mention(nm) {
  if (!(CH.me && CH.me.signed_in)) { toast('Войдите, чтобы писать'); return; }
  const el = $('txt'), tag = '@' + nm + ' ';
  const a = (el.selectionStart != null) ? el.selectionStart : el.value.length;
  const b = (el.selectionEnd != null) ? el.selectionEnd : el.value.length;
  el.value = el.value.slice(0, a) + tag + el.value.slice(b);
  const pos = a + tag.length; try { el.setSelectionRange(pos, pos); } catch (_) {}
  el.focus();
}
document.addEventListener('click', e => {
  if (e.target.closest && e.target.closest('a.rt-b, a.seal')) return;   // a badge / a seal: its own link, not a mention
  const rp = e.target.closest && e.target.closest('[data-reply]');
  if (rp) { e.preventDefault(); replyStart(rp.getAttribute('data-reply')); return; }
  const go = e.target.closest && e.target.closest('[data-goto]');
  if (go) { e.preventDefault(); gotoMsg(Number(go.getAttribute('data-goto'))); return; }
  const t = e.target.closest && e.target.closest('[data-nm]');
  if (t) { e.preventDefault(); mention(t.getAttribute('data-nm')); }
});

$('msgs').addEventListener('keydown', e => {
  const go = (e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('[data-goto]');
  if (go) { e.preventDefault(); gotoMsg(Number(go.getAttribute('data-goto'))); }
});

async function showVer() {   // актуальная версия лаунчера: тянем из updater.json (обновляется каждый релиз)
  try {
    const d = await fetch('/elite/dl/updater.json', { cache: 'no-store' }).then(r => r.json());
    if (d && d.version) { const a = $('lv'); a.textContent = 'Лаунчер v' + d.version; a.style.display = ''; }
  } catch (e) {}
}
async function boot() {
  // one whoami for the page and its header (ladder-hdr.js reads the same promise); the own table once for the badges and the header
  window._wa = window._wa || fetch('/ladder/api/c/whoami', { credentials: 'same-origin', cache: 'no-store' }).then(r => r.json()).catch(() => ({}));
  window._oa = window._oa || fetch('/ladder/api/own/all').then(r => r.json()).catch(() => ({}));
  try { CH.me = await window._wa; } catch (e) {}
  renderMe();
  await load(CH.room);
  CH.ready = true; renderMsgs({ toEnd: true });
  pingOnline(); showVer(); loadMarks(true);
  setInterval(() => { load(); if (CH.room !== 'all') load('all'); }, 5000);
  setInterval(pingOnline, 25000);
  setInterval(() => { if (!document.hidden) loadMarks(); }, 120000);
}
boot();
</script>
