name: check
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: every Python file compiles
        run: |
          set -e
          for f in $(git ls-files '*.py'); do python3 -m py_compile "$f"; done
      - name: deploy script parses
        run: bash -n deploy/deploy.sh
