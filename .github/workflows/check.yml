name: check
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: every Python file compiles
        run: |
          set -e
          for f in $(git ls-files '*.py'); do python3 -m py_compile "$f"; done
      - name: deploy script parses
        run: bash -n deploy/deploy.sh
