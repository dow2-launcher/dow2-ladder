# /etc/systemd/system/dow2-lobbymirror.service.d/memory.conf  (timeweb; installed 19.11.2026 22:04 UTC)
# 17.11.2026: hard cap after the OOM of the old box (the bounded tcp_mirror.py).
# 20.11.2026 (m19 of 19.11: the whole 3v3 thrown out of the match): at the cap with swap allowed the kernel pages the mirror out
# and its event loop stands for minutes (7 times since 18.11, 2.4-4.6 min each; rss stuck at ~246-251 MB of 250M since 18.11
# 04:13 UTC); every game whose lobby connection goes through Moscow loses its RLink session (OnDeselectProfile) and leaves the
# match. No swap for it: at the cap it is killed at once and back in a second - the games' OwnLobby falls back to rts meanwhile.
[Service]
MemoryMax=250M
MemorySwapMax=0
Restart=always
RestartSec=1
# 20.11.2026: the growth itself was a read loop spinning on a re-raised ETIMEDOUT (see ../README.md, "Mirror memory") - fixed in
# tcp_mirror.py; the cap stays as a guard.
